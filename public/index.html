<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MAGI Monitoring Dashboard</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    
    .container {
      width: 100%;
      max-width: 1200px;
      background: white;
      border-radius: 12px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      overflow: hidden;
    }
    
    .header {
      background: #1e3c72;
      color: white;
      padding: 30px;
      text-align: center;
    }
    
    .header h1 {
      font-size: 28px;
      margin-bottom: 5px;
    }
    
    .header p {
      opacity: 0.9;
      font-size: 14px;
    }
    
    .content {
      padding: 30px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 20px;
    }
    
    .card {
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 20px;
      background: #f9f9f9;
    }
    
    .card h2 {
      color: #1e3c72;
      font-size: 18px;
      margin-bottom: 15px;
      border-bottom: 2px solid #2a5298;
      padding-bottom: 10px;
    }
    
    .card-content {
      color: #666;
      line-height: 1.6;
      font-size: 14px;
    }
    
    .metric {
      display: flex;
      justify-content: space-between;
      padding: 8px 0;
      border-bottom: 1px solid #eee;
    }
    
    .metric-label {
      font-weight: 500;
      color: #333;
    }
    
    .metric-value {
      color: #2a5298;
      font-weight: bold;
    }
    
    .status-ok {
      color: #28a745;
    }
    
    .status-alert {
      color: #dc3545;
    }
    
    .status-warning {
      color: #ffc107;
    }
    
    .loading {
      text-align: center;
      color: #999;
      padding: 20px;
    }
    
    .error {
      background: #fadbd8;
      color: #c0392b;
      padding: 10px;
      border-radius: 4px;
      margin: 5px 0;
    }
    
    .footer {
      background: #f5f5f5;
      padding: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-top: 1px solid #ddd;
    }
    
    .footer-links {
      display: flex;
      gap: 15px;
    }
    
    .footer-link {
      color: #2a5298;
      text-decoration: none;
      font-weight: bold;
      padding: 8px 16px;
      border: 2px solid #2a5298;
      border-radius: 6px;
      transition: all 0.3s;
    }
    
    .footer-link:hover {
      background: #2a5298;
      color: white;
    }
    
    .timestamp {
      color: #999;
      font-size: 12px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>🎯 MAGI Monitoring Dashboard</h1>
      <p>System Health & Performance Monitor</p>
    </div>
    
    <div class="content">
      <!-- Cloud Run Services -->
      <div class="card">
        <h2>☁️ Cloud Run Services</h2>
        <div class="card-content" id="services">
          <div class="loading">データ読込中...</div>
        </div>
      </div>
      
      <!-- BigQuery -->
      <div class="card">
        <h2>📊 BigQuery Database</h2>
        <div class="card-content" id="bigquery">
          <div class="loading">データ読込中...</div>
        </div>
      </div>
      
      <!-- System Logs -->
      <div class="card">
        <h2>📋 System Logs</h2>
        <div class="card-content" id="logs">
          <div class="loading">データ読込中...</div>
        </div>
      </div>
      
      <!-- Overall Status -->
      <div class="card">
        <h2>🔔 Overall Status</h2>
        <div class="card-content" id="status">
          <div class="loading">データ読込中...</div>
        </div>
      </div>
    </div>
    
    <div class="footer">
      <div class="timestamp" id="lastUpdate">最終更新: -</div>
      <div class="footer-links">
        <a href="https://magi-ui-dtrah63zyq-an.a.run.app" class="footer-link" target="_blank">→ MAGI UI</a>
      </div>
    </div>
  </div>
  
  <script>
    async function loadData() {
      try {
        // Services
        const servicesResp = await fetch('/api/services');
        const servicesData = await servicesResp.json();
        displayServices(servicesData);
        
        // BigQuery
        const bqResp = await fetch('/api/bigquery');
        const bqData = await bqResp.json();
        displayBigQuery(bqData);
        
        // Logs
        const logsResp = await fetch('/api/logs');
        const logsData = await logsResp.json();
        displayLogs(logsData);
        
        // Status
        updateStatus(servicesData, bqData, logsData);
        
        // Update timestamp
        document.getElementById('lastUpdate').textContent = 'リアルタイム更新: ' + new Date().toLocaleString('ja-JP');
      } catch (e) {
        console.error('Error:', e);
      }
    }
    
    function displayServices(data) {
      const html = data.services.map(s => `
        <div class="metric">
          <span class="metric-label">${s.name}</span>
          <span class="metric-value status-ok">✓ 稼働</span>
        </div>
      `).join('');
      document.getElementById('services').innerHTML = html || '<div class="error">データ取得失敗</div>';
    }
    
    function displayBigQuery(data) {
      if (data.error) {
        document.getElementById('bigquery').innerHTML = '<div class="error">' + data.error + '</div>';
        return;
      }
      const html = `
        <div class="metric">
          <span class="metric-label">データセット</span>
          <span class="metric-value">${data.dataset}</span>
        </div>
        <div class="metric">
          <span class="metric-label">テーブル</span>
          <span class="metric-value">${data.table}</span>
        </div>
        <div class="metric">
          <span class="metric-label">レコード数</span>
          <span class="metric-value">${data.rows || 'N/A'}</span>
        </div>
        <div class="metric">
          <span class="metric-label">ストレージ</span>
          <span class="metric-value">${formatBytes(data.bytes) || 'N/A'}</span>
        </div>
      `;
      document.getElementById('bigquery').innerHTML = html;
    }
    
    function displayLogs(data) {
      if (data.error) {
        document.getElementById('logs').innerHTML = '<div class="error">' + data.error + '</div>';
        return;
      }
      const errorStatus = data.errors > 0 ? 'status-alert' : 'status-ok';
      const warningStatus = data.warnings > 0 ? 'status-warning' : 'status-ok';
      const html = `
        <div class="metric">
          <span class="metric-label">エラー</span>
          <span class="metric-value ${errorStatus}">${data.errors}</span>
        </div>
        <div class="metric">
          <span class="metric-label">警告</span>
          <span class="metric-value ${warningStatus}">${data.warnings}</span>
        </div>
        <div class="metric">
          <span class="metric-label">ステータス</span>
          <span class="metric-value ${data.status === 'OK' ? 'status-ok' : 'status-alert'}">${data.status}</span>
        </div>
      `;
      document.getElementById('logs').innerHTML = html;
    }
    
    function updateStatus(services, bq, logs) {
      const serviceCount = services.services ? services.services.length : 0;
      const isHealthy = !bq.error && !logs.error && logs.status === 'OK';
      const statusClass = isHealthy ? 'status-ok' : 'status-alert';
      const statusText = isHealthy ? '正常' : '注意';
      
      const html = `
        <div class="metric">
          <span class="metric-label">稼働中のサービス</span>
          <span class="metric-value">${serviceCount}個</span>
        </div>
        <div class="metric">
          <span class="metric-label">システムステータス</span>
          <span class="metric-value ${statusClass}">${statusText}</span>
        </div>
      `;
      document.getElementById('status').innerHTML = html;
    }
    
    function formatBytes(bytes) {
      if (!bytes) return 'N/A';
      const sizes = ['B', 'KB', 'MB', 'GB'];
      let i = 0;
      let num = bytes;
      while (num >= 1024 && i < sizes.length - 1) {
        num /= 1024;
        i++;
      }
      return num.toFixed(2) + ' ' + sizes[i];
    }
    
    // 初期読込
    loadData();
    
    // 30秒ごとにリフレッシュ
    setInterval(loadData, 30000);
  </script>
</body>
</html>
