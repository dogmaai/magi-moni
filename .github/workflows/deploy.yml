name: Deploy to Cloud Run

on:
  push:
    branches:
      - main

env:
  PROJECT_ID: screen-share-459802
  REGION: asia-northeast1
  SERVICE_NAME: magi-moni

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2.1.13
        with:
          workload_identity_provider: 'projects/398890937507/locations/global/workloadIdentityPools/github-pool/providers/github-provider'
          service_account: 'github-actions@screen-share-459802.iam.gserviceaccount.com'

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2.2.1

      - name: Deploy to Cloud Run
        # --update-secrets を使うことで既存の secret マウントを保持しつつ
        # 必要な secret を追加できる。--set-secrets は全リセットなので使わない。
        # DISCORD_WEBHOOK_URL: 日次・週次レポートの唯一の通知先 (lib/discord.js)。
        # 手動設定に頼らず毎回のデプロイでバインドする (Jun 2026-11-12)。
        # --max-instances=1: 承認待ちはプロセス内保持のため、ボタン押下が別
        # インスタンスに届かないよう 1 台に固定する (Jun 2026-11-09)。
        run: |
          gcloud run deploy ${{ env.SERVICE_NAME }} \
            --region=${{ env.REGION }} \
            --source=. \
            --platform=managed \
            --memory=512Mi \
            --timeout=300 \
            --max-instances=1 \
            --allow-unauthenticated \
            --update-env-vars="GOOGLE_CLOUD_PROJECT=${{ env.PROJECT_ID }}" \
            --update-secrets="GEMINI_API_KEY=GEMINI_API_KEY:latest,DISCORD_WEBHOOK_URL=DISCORD_WEBHOOK_URL:latest"
